<!DOCTYPE html>
<html>
<head>
  <title>Register - Bus Reservation</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
  <header>
    <h1>Bus Reservation System</h1>
    <nav id="navMenu">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="container" style="max-width: 400px;">
    <h2>User Registration</h2>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email ID:</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" style="width: 100%;">Create Account</button>
    </form>
    <p style="margin-top: 15px; text-align: center; color: #666; font-size: 14px;">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: 'user' // Default to normal user
        };

        fetch(SUPABASE_URL + '/users', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok) {
                alert("Account created successfully! You can now login.");
                window.location.href = "login.html";
            } else {
                alert("Error: Email might already be taken.");
            }
        });
    });
  </script>
</body>
</html>
