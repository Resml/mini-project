<!DOCTYPE html>
<html>
<head>
  <title>My Bookings</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
  <header>
    <h1>Bus Reservation System</h1>
    <nav id="navMenu"></nav>
  </header>

  <div class="container">
    <h2>My Booking History</h2>
    <table>
      <thead>
        <tr>
          <th>Booking Ref</th>
          <th>Bus Number/ID</th>
          <th>Journey Date</th>
          <th>Passengers</th>
          <th>Total Amount (Rs.)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="myBookingsData">
        <tr><td colspan="6">Loading your bookings...</td></tr>
      </tbody>
    </table>
    <br/>
    <a href="index.html" style="display:inline-block; padding: 10px 15px; background: #333; color: white; text-decoration: none; border-radius: 4px;">Back to Home</a>
  </div>



  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        const user = JSON.parse(localStorage.getItem("bus_user"));
        if(!user || user.role === 'admin') {
            alert("Only normal users can view their bookings page.");
            window.location.href = "login.html";
            return;
        }

        fetch(`${SUPABASE_URL}/bookings?user_id=eq.${user.id}&order=booking_date.desc`, { headers: headers })
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById("myBookingsData");
            tbody.innerHTML = "";
            if(data.length > 0) {
                data.forEach(b => {
                    tbody.innerHTML += `<tr>
                        <td><strong>${b.booking_reference}</strong></td>
                        <td>Bus #${b.bus_id}</td>
                        <td>${b.journey_date}</td>
                        <td>${b.passengers}</td>
                        <td>${b.total_amount}</td>
                        <td>${b.status}</td>
                    </tr>`;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='6'>You have not booked any buses yet!</td></tr>";
            }
        }).catch(err => {
            console.error(err);
            document.getElementById("myBookingsData").innerHTML = "<tr><td colspan='6'>Failed to fetch history</td></tr>";
        });
    });
  </script>
</body>
</html>
