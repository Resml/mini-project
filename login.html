<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bus Reservation</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
  <header>
    <h1>Bus Reservation System</h1>
    <nav id="navMenu"></nav>
  </header>

  <div class="container" style="max-width: 400px;">
    <h2>User / Admin Login</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center; color: #666; font-size: 14px;">Don't have an account? <a href="register.html">Sign Up here</a></p>
    <p style="margin-top: 10px; text-align: center; color: #999; font-size: 12px;">Admin use: admin@busgo.com / admin123</p>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;

        fetch(`${SUPABASE_URL}/users?email=eq.${email}&password=eq.${pass}&select=id,name,role`, { headers: headers })
        .then(res => res.json())
        .then(data => {
            if(data.length > 0) {
                localStorage.setItem("bus_user", JSON.stringify(data[0]));
                if(data[0].role === 'admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html";
                }
            } else {
                alert("Invalid Email or Password");
            }
        });
    });
  </script>
</body>
</html>
